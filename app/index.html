<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JobScout Cockpit</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b4bff'/%3E%3Ccircle cx='14' cy='14' r='6' fill='none' stroke='white' stroke-width='3'/%3E%3Cpath d='M19 19l6 6' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="5.5"/><path d="M15 15l5 5"/></svg>
        </div>
        <div>
          <div class="brand-name">JobScout</div>
          <div class="brand-sub">Bewerbungs-Cockpit</div>
        </div>
      </div>

      <nav class="nav" id="nav">
        <div class="nav-label">Übersicht</div>
        <a href="#dashboard" data-view="dashboard"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>Dashboard</a>
        <div class="nav-label">Bewerben</div>
        <a href="#stellen" data-view="stellen"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Stellen<span class="nav-badge" id="badge-neu"></span></a>
        <a href="#pipeline" data-view="pipeline"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></svg>Pipeline<span class="nav-badge warn" id="badge-faellig"></span></a>
        <a href="#dokumente" data-view="dokumente"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>Unterlagen</a>
        <a href="#interview" data-view="interview"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Interview-Prep</a>
        <div class="nav-label">Weiterentwickeln</div>
        <a href="#skills" data-view="skills"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg>Skill-Radar</a>
        <a href="#einstellungen" data-view="einstellungen"><svg viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Einstellungen</a>
        <a href="#automationen" data-view="automationen"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>Automatisierungen</a>
      </nav>

      <div class="sidebar-foot">
        <div class="lauf-info"><span class="dot" id="lauf-dot"></span><span id="lauf-text">Lade …</span></div>
        <button class="btn btn-soft btn-block" data-task="scout"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>Neue Stellen suchen</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Menü"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <div>
          <h1 id="view-title">Dashboard</h1>
          <p id="view-sub" class="muted"></p>
        </div>
        <div class="topbar-actions" id="topbar-actions"></div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>

  <div class="toast-wrap" id="toasts" aria-live="polite"></div>
  <dialog id="dialog" class="dialog"></dialog>

  <script src="/app.js"></script>
  <script src="/einstellungen.js"></script>
</body>
</html>
